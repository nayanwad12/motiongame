<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>One Shape</title>
<style>
@font-face{font-family:"Geist";src:url("__GEIST__") format("woff2");font-weight:100 900;font-style:normal;}
:root{--canvas:#E8E5E0;--ink:#0F0F0E;--muted:#8C877F;--soft:#F1EFEB;--line:#ECE9E4;--acc:#35FF69;}
*{box-sizing:border-box}
html,body{margin:0;background:var(--canvas);}
body{display:flex;align-items:center;justify-content:center;min-height:100vh;overflow:hidden}
#stage{position:relative;flex:none;width:1440px;height:1440px;overflow:hidden;background:var(--canvas);
  font-family:"Geist",system-ui,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased;
  font-feature-settings:"ss01" 0;transform-origin:50% 50%}
#cam,#obj,.layer{position:absolute;left:0;top:0;width:0;height:0;transform-origin:0 0}
.a{position:absolute;left:0;top:0;transform-origin:0 0}
.c{position:absolute;left:0;top:0;white-space:nowrap}
svg{display:block;overflow:visible}
.ic{fill:none;stroke:var(--ink);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.cap{display:flex;align-items:center;justify-content:center;height:26px;min-width:30px;padding:0 7px;border-radius:7px;
  background:var(--soft);color:var(--muted);font-size:13px;font-weight:600;letter-spacing:.01em}
.tab{font-size:17px;font-weight:600;letter-spacing:-.01em}
.row{display:flex;align-items:center;gap:14px;font-size:17px;font-weight:500;letter-spacing:-.01em}
.row .ch{display:inline-block;white-space:pre}
.num{font-variant-numeric:tabular-nums}
#cursor{position:absolute;left:0;top:0;transform-origin:0 0}
</style>
</head>

    <svg id="plot" class="c" width="496" height="230" viewBox="-248 0 496 230" style="transform:translate(-248px,186px)">

   <!-- 11 · command palette input row (top-anchored, edge-anchored) -->

    <svg id="pSearch" class="c" width="22" height="22" viewBox="0 0 22 22"><circle class="ic" cx="9.8" cy="9.8" r="6"/><path class="ic" d="M14.4 14.4L18.5 18.5"/></svg>

    </div>
    <div id="pK" class="c cap"><svg width="13" height="13" viewBox="0 0 13 13"><path fill="none" stroke="#8C877F" stroke-width="1.5" d="M4.5 4.5h4v4h-4zM4.5 4.5H3a1.5 1.5 0 1 1 1.5-1.5zM8.5 4.5V3A1.5 1.5 0 1 1 10 4.5zM8.5 8.5H10A1.5 1.5 0 1 1 8.5 10zM4.5 8.5V10A1.5 1.5 0 1 1 3 8.5z"/></svg><span style="margin-left:2px">K</span></div>
    <div id="pEsc" class="c cap">esc</div>
   </div>
   <!-- palette rows -->

    <div id="pDiv" class="a" style="height:1px;background:#EEEBE6"></div>

   </div>

   <!-- 12 · toast -->

    <div class="c" style="width:300px;display:flex;align-items:center;justify-content:space-between;transform:translate(-150px,-17px)">
     <div style="display:flex;align-items:center;gap:12px">
      <div style="width:34px;height:34px;border-radius:17px;background:var(--acc);display:flex;align-items:center;justify-content:center">
       <svg width="22" height="22" viewBox="0 0 22 22"><path class="ic" d="M5.5 11.5l3.6 3.6 7.4-8.2"/></svg>
      </div>
      <span style="font-size:18px;font-weight:600;letter-spacing:-.015em">Changes saved</span>
     </div>
     <span style="font-size:16px;font-weight:600;color:var(--muted)">Undo</span>
    </div>
   </div>
   </div></div>
  </div>
 </div>

 <svg id="cursor" width="40" height="48" viewBox="0 0 20 24">
  <path d="M2.2 1.6v17.2c0 .7.8 1 1.3.5l3.9-4 2.6 6.1c.2.5.8.7 1.3.5l2-.9c.5-.2.7-.8.5-1.3l-2.6-6h5.6c.7 0 1-.8.5-1.3L3.5 1.1c-.5-.5-1.3-.2-1.3.5z"
        fill="#0F0F0E" stroke="#fff" stroke-width="1.5" stroke-linejoin="round"/>
 </svg>
</div>

<script>
(() => {
'use strict';
const T = 14;                       // 7 bars × 4 beats × 0.5 s
const $ = id => document.getElementById(id);
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const mix = (a, b, k) => a + (b - a) * k;

// ── springs: closed-form step responses ─────────────────────────────
function sstep(t, w, z) {           // 0 → 1, starting at rest
  if (t <= 0) return 0;
  if (z < 1) {
    const wd = w * Math.sqrt(1 - z * z), e = Math.exp(-z * w * t);
    return 1 - e * (Math.cos(wd * t) + (z * w / wd) * Math.sin(wd * t));
  }
  return 1 - Math.exp(-w * t) * (1 + w * t);
}
function sdisp(t, x0, v0, w, z) {   // displacement released at x0 with velocity v0
  if (t <= 0) return x0;
  if (z < 1) {
    const wd = w * Math.sqrt(1 - z * z), e = Math.exp(-z * w * t);
    return e * (x0 * Math.cos(wd * t) + ((v0 + z * w * x0) / wd) * Math.sin(wd * t));
  }
  return (x0 + (v0 + w * x0) * t) * Math.exp(-w * t);
}
const SP = {
  morph: [17, .88], snap: [24, .85], cam: [10.5, 1], cur: [14, 1],
  in: [26, 1], out: [56, 1], lead: [34, .84], trail: [15, 1],
  draw: [10, 1], press: [55, 1], rel: [28, .8], soft: [18, 1],
};
const S = (t, sp) => sstep(t, sp[0], sp[1]);

// A value that changes target many times = one spring per change.
// Periodic: the previous loop's springs are still settling at t = 0,
// so position AND velocity at t = T equal those at t = 0.
function track(keys, sp) {
  const base = keys[keys.length - 1][1], ev = [];
  let prev = base;
  for (const k of keys) { const d = k[1] - prev; if (d) ev.push([k[0], d, k[2] || sp]); prev = k[1]; }
  return t => { let v = base; for (const e of ev) v += e[1] * (S(t - e[0], e[2]) + S(t + T - e[0], e[2]) - 1); return v; };
}
// content enter / exit with its own timing (exit is immediate and fast, enter waits)
function vis(t, tin, tout, dIn = .08) {
  if (tout < tin) tout += T;
  const f = tt => { const e = S(tt - tin - dIn, SP.in), x = S(tt - tout, SP.out); return { e, x, o: e * (1 - x) }; };
  const a = f(t), b = f(t + T);
  return b.o > a.o ? b : a;
}
let Z = 1;                          // current camera zoom (for screen-constant blur/hairlines)
function show(el, v, y = 0, x = 0, blur = 14) {
  const sc = (.955 + .045 * v.e) * (1 - .035 * v.x);
  el.style.transform = `translate(${x}px,${y}px) scale(${sc})`;
  el.style.opacity = v.o.toFixed(4);
  const b = (blur / Z) * ((1 - v.e) + v.x);
  el.style.filter = (b > .02 && v.o > .003) ? `blur(${b.toFixed(3)}px)` : 'none';
  el.style.visibility = v.o < .003 ? 'hidden' : 'visible';
}
const px = (el, x, y, s) => { el.style.transform = `translate(${x}px,${y}px)` + (s !== undefined ? ` scale(${s})` : ''); };
const ctr = (el, x, y, s = 1) => { el.style.transform = `translate(${x}px,${y}px) translate(-50%,-50%) scale(${s})`; };
const box = (el, l, t, w, h, r) => {
  el.style.transform = `translate(${l}px,${t}px)`; el.style.width = w + 'px'; el.style.height = h + 'px';
  if (r !== undefined) el.style.borderRadius = r + 'px';
};
const WHITE = [255, 255, 255], ACC = [53, 255, 105], SOFT = [241, 239, 235];
const rgb = (a, b, k) => `rgb(${a.map((v, i) => Math.round(mix(v, b[i], k))).join(',')})`;

// ── beat grid (seconds) ─────────────────────────────────────────────
const B = { loader: 1, check: 1.5, island: 2, player: 3, slider: 5, toggle: 7.5, on: 8, tabs: 8.5,
            chart: 10, kbar: 11.5, palette: 11.75, toast: 13, button: 13.5 };

// ── the shape ───────────────────────────────────────────────────────
const shW = track([[0, 220], [1, 72], [2, 340], [3, 520], [5, 460], [7.5, 136], [8.5, 420], [10, 560],
                   [11.5, 200], [11.75, 520], [13, 340], [13.5, 220]], SP.morph);
const shH = track([[0, 72], [3, 300], [5, 72], [10, 440], [11.5, 72], [11.75, 366], [12, 310], [12.25, 198],
                   [12.5, 142], [13, 72]], SP.morph);
const shR = track([[0, 36], [3, 40], [5, 36], [10, 40], [11.5, 36], [11.75, 28], [13, 36]], SP.morph);
const shG = track([[0, 0], [1.5, 1], [2, 0], [8, 1], [8.5, 0]], SP.soft);        // green amount
// palette keeps its top edge fixed while it filters; same spring as height so the top is exact
const shY = track([[0, 0], [11.75, 0], [12, -28], [12.25, -84], [12.5, -112], [13, 0]], SP.morph);
const press = track([[0, 0], [.5, 1, SP.press], [.6, 0, SP.rel], [2.5, 1, SP.press], [2.6, 0, SP.rel],
                     [8, 1, SP.press], [8.1, 0, SP.rel], [13, 1, SP.press], [13.1, 0, SP.rel]], SP.rel);

// ── camera ──────────────────────────────────────────────────────────
const camZ = track([[0, 3.2], [1, 6], [2, 2.6], [3, 1.95], [5, 2.2], [7.5, 4], [8.5, 2.4], [10, 1.9],
                    [11.5, 3], [11.75, 1.95], [12.25, 2.05], [12.5, 2.15], [13, 2.6], [13.5, 3.2]], SP.cam);
const camY = track([[0, 0], [11.75, 0], [12, -28], [12.25, -84], [12.5, -112], [13, 0]], SP.cam);

// ── cursor (world coords) ───────────────────────────────────────────
const CUR = [
  [.72, 66, 58],
  [2.02, 64, 8],
  [3.02, 4, 104],
  [3.6, -92, 11],
  [4.03, 96, 13], [4.45, 38, 10],
  [5.4, 58, 2],
  [6.03, 205, 2], [6.42, 272, -1],
  [7.08, 24, 16],
  [8.52, 4, 10],
  [9.06, 138, 10],
  [10.04, 70, 62], [10.64, 205, 40],
  [11.28, 205, 150],
  [13.1, 118, 76], [13.56, 14, 10],
];
const curX = track(CUR.map(k => [k[0], k[1]]), SP.cur);
const curY = track(CUR.map(k => [k[0], k[2]]), SP.cur);
const CLICKS = [.5, 2.5, 3.5, 8, 9, 9.5];
const HOLDS = [[4, 4.9], [6, 7]];
const curP = track([[0, 0], ...CLICKS.flatMap(c => [[c - .02, 1, SP.press], [c + .07, 0, SP.rel]]),
                    ...HOLDS.flatMap(h => [[h[0] - .02, 1, SP.press], [h[1], 0, SP.rel]])], SP.rel);
const held = track([[0, 0], ...HOLDS.flatMap(h => [[h[0], 1, SP.snap], [h[1], 0, SP.rel]])], SP.snap);

// ── scrub: direct manipulation of the playhead ──────────────────────
const TL = -232, TR = 232, P0 = .30, RATE = 1 / 204;
const [G1, R1] = HOLDS[0];
const pPlay = t => P0 + Math.max(0, t - 3.5) * RATE;
const off1 = curX(G1) - (TL + pPlay(G1) * (TR - TL));
const pHold = t => clamp((curX(t) - off1 - TL) / (TR - TL), 0, 1);
const pRel = pHold(R1);
const prog = t => t < G1 ? pPlay(t) : t <= R1 ? pHold(t) : pRel + (t - R1) * RATE;

// ── volume: drag past max stretches the shape, release springs back ─
const VL = -150, VR = 196, V0 = .6;
const [G2, R2] = HOLDS[1];
const off2 = curX(G2) - (VL + V0 * (VR - VL));
const rubber = x => x <= 0 ? 0 : 110 * (1 - 1 / (x * .8 / 110 + 1));
const vRaw = t => (curX(t) - off2 - VL) / (VR - VL);
const stretchHold = t => rubber((vRaw(t) - 1) * (VR - VL));
const stR = stretchHold(R2), stV = (stretchHold(R2) - stretchHold(R2 - 1e-3)) / 1e-3;
const vol = t => t < G2 ? V0 : t <= R2 ? clamp(vRaw(t), 0, 1) : 1;
const stretch = t => t < G2 ? 0 : t <= R2 ? stretchHold(t) : sdisp(t - R2, stR, stV, SP.rel[0], SP.rel[1]);

// ── toggle knob → tab indicator: two edges, two springs ─────────────
// leading edge rides a stiff spring, trailing edge a soft one → it stretches, then catches up
function edges(keys) {           // keys: [t, L, R]
  const Lk = [], Rk = [];
  keys.forEach((k, i) => {
    const prev = keys[(i - 1 + keys.length) % keys.length];
    const right = (k[1] + k[2]) > (prev[1] + prev[2]);
    Lk.push([k[0], k[1], right ? SP.trail : SP.lead]);
    Rk.push([k[0], k[2], right ? SP.lead : SP.trail]);
  });
  return { L: track(Lk, SP.lead), R: track(Rk, SP.lead), keys };
}
const slot = (w, i) => { const s = (w - 16) / 3; return [-(w - 16) / 2 + i * s, -(w - 16) / 2 + (i + 1) * s]; };
const KB = edges([
  [0, -60, -4], [7.5, -60, -4], [8, 4, 60],
  [8.5, ...slot(420, 0)], [9, ...slot(420, 1)], [9.5, ...slot(420, 2)], [10, ...slot(560, 2)],
]);
const kbTargetW = t => { let k = KB.keys[0]; for (const q of KB.keys) if (t >= q[0]) k = q; return k[2] - k[1]; };

// ── chart data ──────────────────────────────────────────────────────
const DATA = [18.2, 21.5, 19.8, 24.6, 23.1, 28.4, 31.9, 41.3, 37.2, 44.8, 52.6, 48.2];
const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const PX = i => -248 + i * 496 / 11, PY = v => 180 - (v - 10) / 50 * 180;
const pts = DATA.map((v, i) => [PX(i), PY(v)]);
let d = `M${pts[0][0]} ${pts[0][1]}`;
for (let i = 0; i < pts.length - 1; i++) {   // Catmull-Rom → Bézier
  const p0 = pts[Math.max(0, i - 1)], p1 = pts[i], p2 = pts[i + 1], p3 = pts[Math.min(pts.length - 1, i + 2)];
  const c1 = [p1[0] + (p2[0] - p0[0]) / 6, p1[1] + (p2[1] - p0[1]) / 6], c2 = [p2[0] - (p3[0] - p1[0]) / 6, p2[1] - (p3[1] - p1[1]) / 6];
  d += ` C${c1[0].toFixed(2)} ${c1[1].toFixed(2)} ${c2[0].toFixed(2)} ${c2[1].toFixed(2)} ${p2[0].toFixed(2)} ${p2[1].toFixed(2)}`;
}
$('line').setAttribute('d', d);
$('area').setAttribute('d', d + ` L248 180 L-248 180 Z`);
$('months').innerHTML = MON.map((m, i) => `<text x="${PX(i)}" y="208">${m[0]}</text>`).join('');
// hover: nearest point from the cursor path; crossing times precomputed from the (pure) cursor function
const H0 = 10.42, H1 = B.kbar;
const CHART_TOP = -220;                                  // card top in world coords at rest (h = 440)
const nearest = x => clamp(Math.round((x + 248) / (496 / 11)), 0, 11);
const hovKeys = [];
for (let t = H0, prev = -1; t <= H1; t += 1 / 1200) { const i = nearest(curX(t)); if (i !== prev) { hovKeys.push([t, i]); prev = i; } }
const hovX = track(hovKeys.map(k => [k[0], PX(k[1])]), SP.lead);
const hovY = track(hovKeys.map(k => [k[0], PY(DATA[k[1]])]), SP.lead);
const hovI = t => { let i = hovKeys[0][1]; for (const k of hovKeys) if (t >= k[0]) i = k[1]; return i; };

// ── command palette ─────────────────────────────────────────────────
const ROWS = [
  ['New document', '<path class="ic" d="M6 3h6.5L17 7.5V19H6z"/><path class="ic" d="M12.5 3v4.5H17"/>'],
  ['Toggle theme', '<path class="ic" d="M18 13.3A7 7 0 1 1 9.2 4a5.6 5.6 0 0 0 8.8 9.3z"/>'],
  ['Share link',   '<path class="ic" d="M9.6 12.4a3.4 3.4 0 0 0 4.8 0l2.9-2.9a3.4 3.4 0 0 0-4.8-4.8l-.9.9"/><path class="ic" d="M12.4 9.6a3.4 3.4 0 0 0-4.8 0l-2.9 2.9a3.4 3.4 0 0 0 4.8 4.8l.9-.9"/>'],
  ['Show toast',   '<path class="ic" d="M6 15.2V10a5 5 0 0 1 10 0v5.2l1.4 1.8H4.6z"/><path class="ic" d="M9.4 19.4a1.9 1.9 0 0 0 3.2 0"/>'],
  ['Export chart', '<path class="ic" d="M4 18.5h14"/><path class="ic" d="M7 15v-3.5M11 15V7M15 15V9.5"/>'],
];
const KEYS = [[12, 't'], [12.25, 'to'], [12.5, 'toa']];
const QUERIES = [[11.75, ''], ...KEYS];
const matchSet = (label, q) => { const i = q ? label.toLowerCase().indexOf(q) : -1; return q ? (i < 0 ? null : [i, i + q.length]) : [0, 0]; };
$('rows').innerHTML = ROWS.map((r, i) =>
  `<div class="c row" id="row${i}"><svg width="22" height="22" viewBox="0 0 22 22">${r[1]}</svg><span>${
    [...r[0]].map((c, j) => `<span class="ch" id="r${i}c${j}">${c}</span>`).join('')}</span></div>`).join('');
const rowSlot = [], rowOut = [], charDark = [];
ROWS.forEach((r, i) => {
  const keys = []; let out = B.toast;
  for (const [tq, q] of QUERIES) {
    const shown = ROWS.map(rr => matchSet(rr[0], q)).map((m, k) => m ? k : -1).filter(k => k >= 0);
    const s = shown.indexOf(i);
    if (s < 0) { if (out === B.toast) out = tq; } else keys.push([tq, s]);
  }
  rowSlot.push(track(keys, SP.morph)); rowOut.push(out);
  charDark.push([...r[0]].map((c, j) => track(QUERIES.map(([tq, q]) => {
    const m = matchSet(r[0], q); return [tq, !q ? 1 : (m && j >= m[0] && j < m[1]) ? 1 : 0];
  }), SP.soft)));
});

// ── sound cues (read by the audio mixer; each sound is placed by its measured peak) ──
window.CUES = [
  [.5, 'click'], [1.08, 'whoosh'], [1.5, 'chime'], [2.08, 'whoosh'], [2.5, 'click'], [3.08, 'whoosh'], [3.5, 'click'],
  [4, 'grab'], [4.25, 'tick'], [4.5, 'tick'], [4.75, 'tick'], [4.9, 'release'], [5.08, 'whoosh'], [5.5, 'tick'],
  [6, 'grab'], [6.5, 'tick'], [7, 'release'], [7.58, 'whoosh'], [8, 'toggle'], [8.58, 'whoosh'], [9, 'tick'], [9.5, 'tick'],
  [10.08, 'whoosh'], [10.5, 'tick'], [11, 'tick'], [11.56, 'whoosh'], [11.78, 'pop'],
  [12, 'key'], [12.25, 'key'], [12.5, 'key'], [13, 'enter'], [13.06, 'chime'], [13.58, 'whoosh'],
];
window.DURATION = T;

// ── play / pause morph ──────────────────────────────────────────────
const PLAY = [[[5, 2.6], [12.6, 6.8], [12.6, 15.2], [5, 19.4]], [[12.6, 6.8], [19.6, 11], [19.6, 11], [12.6, 15.2]]];
const PAUSE = [[[4.6, 3.5], [9.2, 3.5], [9.2, 18.5], [4.6, 18.5]], [[12.8, 3.5], [17.4, 3.5], [17.4, 18.5], [12.8, 18.5]]];
const poly = (a, b, k) => 'M' + a.map((p, i) => `${mix(p[0], b[i][0], k).toFixed(2)} ${mix(p[1], b[i][1], k).toFixed(2)}`).join('L') + 'Z';

const fmt = s => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}`;
const el = {}; ['stage','cam','obj','shape','clip','Lbtn','btnRow','btnArrow','Lload','arc','Lcheck','chk','art','Lisl','Lply','tCur',
  'playBtn','pp1','pp2','Lvol','spk','w1','w2','trk','fill','seg','knob','Ltab','tabBase','tabHi','Lchart','kpi','revealR','line',
  'guide','dot','tip','tipM','tipV','Lpal','pSearch','pPh1','pPh2','pType','ch0','ch1','ch2','caret','pK','pEsc','Lrows',
  'pDiv','pHi','pEnter','Ltoast','cursor'].forEach(k => el[k] = $(k));
const tabsB = [...el.tabBase.children], tabsH = [...el.tabHi.children];

// ── seek(t): every style is a pure function of time ────────────────
function seek(time) {
  const t = ((time % T) + T) % T;
  Z = camZ(t);
  const fy = camY(t);
  el.cam.style.transform = `translate(${720}px,${720 - fy * Z}px) scale(${Z})`;
  el.obj.style.transform = `scale(${1 - .03 * press(t)})`;

  // shape
  const st = stretch(t);
  const w = shW(t) + st, h = shH(t) - st * .12, r = Math.min(shR(t), h / 2), oy = shY(t), ox = st / 2;
  const top = oy - h / 2;
  box(el.shape, ox - w / 2, top, w, h, r);
  el.shape.style.background = rgb(WHITE, ACC, shG(t));
  el.clip.style.clipPath = `inset(${1200 + top}px ${1200 - (ox + w / 2)}px ${1200 - (top + h)}px ${1200 + ox - w / 2}px round ${r}px)`;
  el.shape.style.boxShadow = `0 0 0 ${1 / Z}px rgba(20,16,10,.05), 0 ${2 / Z}px ${4 / Z}px rgba(20,16,10,.05), 0 ${14 / Z}px ${36 / Z}px rgba(20,16,10,.09)`;

  const cx = curX(t), cy = curY(t);

  // button
  const vb = vis(t, B.button, B.loader, .08);
  show(el.Lbtn, vb);
  const hov = clamp(1 - Math.max(Math.abs(cx) - 110, Math.abs(cy) - 36, 0) / 24, 0, 1);
  ctr(el.btnRow, 0, 0);
  el.btnArrow.style.transform = `translateX(${3 * hov}px)`;

  // loader
  const vl = vis(t, B.loader, B.check, .04);
  show(el.Lload, vl);
  const frac = .18 + .82 * S(t - 1.12, [13, 1]);
  el.arc.style.strokeDasharray = `${(frac * 100).toFixed(2)} 100`;
  el.arc.style.transform = `rotate(${-90 + 400 * (t - B.loader) + 120 * S(t - B.loader, SP.soft)}deg)`;

  // check
  const vc = vis(t, B.check, B.island, .04);
  show(el.Lcheck, vc);
  el.chk.style.strokeDasharray = '1 1';
  el.chk.style.strokeDashoffset = (1 - S(t - 1.56, [16, 1])).toFixed(4);

  // shared art (island → player)
  const va = vis(t, B.island, B.slider, .06);
  const kp = S(t - B.player, SP.morph);
  const as = mix(48, 96, kp), ax = mix(-134, -184, kp), ay = mix(0, -74, kp);
  box(el.art, ax - as / 2, ay - as / 2, as, as, mix(12, 20, kp));
  el.art.style.opacity = va.o; el.art.style.visibility = va.o < .003 ? 'hidden' : 'visible';
  el.art.style.filter = va.o > .003 && ((1 - va.e) + va.x) > .002 ? `blur(${(14 / Z) * ((1 - va.e) + va.x)}px)` : 'none';

  show(el.Lisl, vis(t, B.island, B.player, .08));

  // player
  const vp = vis(t, B.player, B.slider, .1);
  show(el.Lply, vp);
  const pk = S(t - 3.5, SP.snap);
  el.pp1.setAttribute('d', poly(PLAY[0], PAUSE[0], pk));
  el.pp2.setAttribute('d', poly(PLAY[1], PAUSE[1], pk));
  const pbp = S(t - 3.48, SP.press) - S(t - 3.57, SP.rel);
  el.playBtn.style.transform = `translate(-30px,70px) scale(${1 - .08 * pbp})`;
  const p = prog(t);
  el.tCur.textContent = fmt(p * 204);

  // volume icon
  show(el.Lvol, vis(t, B.slider, B.toggle, .1));
  const v = vol(t);
  px(el.spk, ox - w / 2 + 24, -11);
  el.w1.style.opacity = clamp(v * 3, 0, 1); el.w2.style.opacity = clamp(v * 3 - 1.2, 0, 1);

  // shared track: progress → volume
  const b5 = S(t - B.slider, SP.morph);
  const vt = vis(t, B.player, B.toggle, .1);
  const xL = Math.max(mix(TL, VL, b5), ox - w / 2 + 20), xR = Math.min(mix(TR, VR, b5) + st, ox + w / 2 - 20), ty = mix(10, 0, b5);
  const fr = mix(p, v, b5);
  box(el.trk, xL, ty - 3, xR - xL, 6);
  el.fill.style.width = (fr * (xR - xL)) + 'px';
  el.trk.style.opacity = vt.o; el.trk.style.visibility = vt.o < .003 ? 'hidden' : 'visible';

  // shared knob
  const vk = vis(t, B.player, B.kbar, .1);
  const kd = mix(16, 24, b5) + 8 * held(t);
  const kxA = xL + fr * (xR - xL);
  const bB = S(t - B.toggle, SP.morph);
  let L = mix(kxA - kd / 2, KB.L(t), bB), R = mix(kxA + kd / 2, KB.R(t), bB);
  L = Math.max(L, ox - w / 2 + 8); R = Math.min(R, ox + w / 2 - 8);
  const squash = clamp((R - L) - kbTargetW(t), 0, 80) * .1;
  const kh = mix(kd, 56 - squash, bB), kyc = mix(ty, top + 36, bB);
  if (R - L < kh) { const m = (L + R) / 2; L = m - kh / 2; R = m + kh / 2; }
  box(el.knob, L, kyc - kh / 2, R - L, kh, kh / 2);
  el.knob.style.opacity = vk.o; el.knob.style.visibility = vk.o < .003 ? 'hidden' : 'visible';
  el.knob.style.filter = vk.o > .003 && (1 - vk.e + vk.x) > .002 ? `blur(${(14 / Z) * (1 - vk.e + vk.x)}px)` : 'none';

  // tabs
  const vtab = vis(t, B.tabs, B.kbar, .1);
  show(el.Ltab, vtab);
  const wIn = w - 16, sw = wIn / 3;
  for (let i = 0; i < 3; i++) {
    const lx = 600 - wIn / 2 + (i + .5) * sw, ly = 600 + top + 36;
    ctr(tabsB[i], lx, ly); ctr(tabsH[i], lx, ly);
  }
  el.tabHi.style.clipPath = `inset(${600 + kyc - kh / 2}px ${600 - R}px ${600 - (kyc + kh / 2)}px ${600 + L}px round ${kh / 2}px)`;
  const vseg = vis(t, B.chart, B.kbar, .02);
  box(el.seg, -wIn / 2, top + 8, wIn, 56, 28);
  el.seg.style.opacity = vseg.o; el.seg.style.visibility = vseg.o < .003 ? 'hidden' : 'visible';

  // chart
  const vch = vis(t, B.chart, B.kbar, .12);
  show(el.Lchart, vch, top);
  const dr = S(t - 10.06, SP.draw);
  el.line.style.strokeDasharray = '1 1';
  el.line.style.strokeDashoffset = (1 - dr).toFixed(4);
  el.revealR.setAttribute('width', (dr * 504).toFixed(2));
  el.kpi.textContent = `$${(48.2 * dr).toFixed(1)}k`;
  const vh = vis(t, H0, B.kbar, 0);
  const hx = hovX(t), hy = hovY(t), hi = hovI(t);
  el.guide.setAttribute('x1', hx); el.guide.setAttribute('x2', hx);
  el.dot.setAttribute('cx', hx); el.dot.setAttribute('cy', hy);
  el.guide.style.opacity = el.dot.style.opacity = vh.o;
  el.tipM.textContent = MON[hi]; el.tipV.textContent = `$${DATA[hi].toFixed(1)}k`;
  el.tip.style.transform = `translate(${hx}px,${186 + hy - 16}px) translate(-50%,-100%) scale(${.9 + .1 * vh.e})`;
  el.tip.style.opacity = vh.o; el.tip.style.visibility = vh.o < .003 ? 'hidden' : 'visible';

  // palette input row: edge-anchored so it rides the morph
  const vpal = vis(t, B.kbar, B.toast, .08);
  show(el.Lpal, vpal, top);
  px(el.pSearch, -w / 2 + 24, 25);
  const vph1 = vis(t, B.kbar, B.palette, .08), vph2 = vis(t, B.palette, 12, .1);
  el.pPh1.style.opacity = vph1.o; px(el.pPh1, -w / 2 + 58, 24);
  el.pPh2.style.opacity = vph2.o; px(el.pPh2, -w / 2 + 58, 24);
  px(el.pType, -w / 2 + 58, 23);
  KEYS.forEach(([tk], i) => {
    const e = S(t - tk, SP.in);
    const c = el['ch' + i];
    c.style.display = t >= tk && t < B.toast + .2 ? 'inline-block' : 'none';
    c.style.opacity = e; c.style.transform = `translateY(${(1 - e) * 5}px)`;
    c.style.filter = e < .995 ? `blur(${(1 - e) * 6 / Z}px)` : 'none';
  });
  const lastKey = KEYS.filter(k => t >= k[0]).map(k => k[0]).pop() ?? B.palette;
  el.caret.style.opacity = (t >= B.palette && ((t - lastKey) % 1) < .55) ? 1 : 0;
  const vK = vis(t, B.kbar, B.palette, .08), vE = vis(t, B.palette, B.toast, .1);
  el.pK.style.opacity = vK.o; el.pEsc.style.opacity = vE.o;
  el.pK.style.transform = `translate(${w / 2 - 18}px,24px) translateX(-100%)`;
  el.pEsc.style.transform = `translate(${w / 2 - 18}px,24px) translateX(-100%)`;

  // palette rows
  const vrows = vis(t, B.palette, B.toast, .1);
  show(el.Lrows, vrows, top);
  box(el.pDiv, -w / 2, 72, w, 1);
  const flash = S(t - 12.96, SP.press);
  box(el.pHi, -w / 2 + 8, 78 + 4, w - 16, 48, 12);
  el.pHi.style.background = rgb(SOFT, ACC, flash);
  ctr(el.pEnter, w / 2 - 34, 78 + 28);
  ROWS.forEach((row, i) => {
    const e = S(t - B.palette - .08 - .035 * i, SP.in), x = S(t - rowOut[i], SP.out);
    const o = e * (1 - x);
    const r = $('row' + i);
    r.style.opacity = o.toFixed(4); r.style.visibility = o < .003 ? 'hidden' : 'visible';
    const bl = (12 / Z) * ((1 - e) + x);
    r.style.filter = bl > .02 && o > .003 ? `blur(${bl}px)` : 'none';
    r.style.transform = `translate(${-w / 2 + 22}px,${78 + 28 + 56 * rowSlot[i](t) + (1 - e) * 10}px) translateY(-50%)`;
    charDark[i].forEach((f, j) => { $(`r${i}c${j}`).style.color = rgb([140, 135, 127], [15, 15, 14], clamp(f(t), 0, 1)); });
  });

  // toast
  show(el.Ltoast, vis(t, B.toast, B.button, .08));

  // cursor (screen space, constant size)
  const sx = 720 + cx * Z * (1 - .03 * press(t)), sy = 720 + (cy - fy) * Z * (1 - .03 * press(t));
  el.cursor.style.transform = `translate(${sx - 4}px,${sy - 3}px) scale(${1 - .14 * curP(t)})`;
}

window.seek = seek;
window.ready = document.fonts.load('600 20px Geist').then(() => document.fonts.ready).then(() => { seek(0); return true; });

// live preview when opened directly (the renderer passes ?render)
if (!/render/.test(location.search)) {
  const fit = () => { el.stage.style.transform = `scale(${Math.min(innerWidth, innerHeight) / 1440})`; };
  fit(); addEventListener('resize', fit);
  let t0 = null;
  const loop = now => { if (t0 === null) t0 = now; seek((now - t0) / 1000); requestAnimationFrame(loop); };
  window.ready.then(() => requestAnimationFrame(loop));
}
})();
</script>
